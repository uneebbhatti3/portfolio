name: portfolio

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio-db}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio-password}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-portfolio-user} -d ${POSTGRES_DB:-portfolio-db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  portfolio_postgres_data:
